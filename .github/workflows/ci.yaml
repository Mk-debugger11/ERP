name: Test Pipeline 
on: 
  push
jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: setup python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.13.5"
      
      - name: install dependencies
        run: pip install -r requirement.txt
      
      - name: run tests
        run: python manage.py test
        