volumes:
  postgres_data:
    external: true
  static_volume:
    external: true
networks:
  erp-network:
    external: true
services:
  postgres:
   image: postgres:14.24-alpine3.23
   container_name: mukul_db
   networks:
    -  erp-network
   env_file: ./Backend/.env
   restart: unless-stopped
   volumes:
    -  postgres_data:/var/lib/postgresql/data
   healthcheck:
     test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
     interval: 15s
     timeout: 10s
     retries: 5
  nginx:
    image: nginx:latest
    container_name: mukul_nginx
    restart: unless-stopped
    ports:
     - 80:80
    networks:
     - erp-network
    volumes:
     - /home/mukulmac/ERP/nginx/django.conf:/etc/nginx/conf.d/default.conf
     - static_volume:/staticfiles
    depends_on:
     - django
  django:
    build: ./Backend
    container_name: mukul_erp
    restart: unless-stopped
    networks:
     -  erp-network
    env_file: ./Backend/.env
    volumes:
     -  static_volume:/config/staticfiles
    depends_on:
       postgres:
         condition: service_healthy
